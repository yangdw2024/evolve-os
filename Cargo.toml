[workspace]
resolver = "2"
members = [
    "crates/core-contracts",
    "crates/ledger-sqlite",
    "crates/llm-router",
    "crates/node-runtime",
    "crates/evolve-loop",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["yangdw2026 <yangdw2021@gmail.com>"]
repository = "https://github.com/yangdw2024/evolve-os"
homepage = "https://github.com/yangdw2024/evolve-os"
rust-version = "1.87"
keywords = ["evolutionary", "llm", "map-elites", "sandbox", "agents"]
categories = ["development-tools", "science"]

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util", "net"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

core-contracts = { package = "evolveos-core-contracts", path = "crates/core-contracts", version = "0.1.0" }
ledger-sqlite = { package = "evolveos-ledger-sqlite", path = "crates/ledger-sqlite", version = "0.1.0" }
llm-router = { package = "evolveos-llm-router", path = "crates/llm-router", version = "0.1.0" }
node-runtime = { package = "evolveos-node-runtime", path = "crates/node-runtime", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
